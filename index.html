<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI SDR Agent — Research-Backed Outreach on Autopilot</title>
<meta name="description" content="A LangGraph multi-agent system that researches prospects, writes personalized B2B outreach, scores leads, and saves to CRM — automatically.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d12;
    --bg-raised: #12151c;
    --bg-card: #161921;
    --line: #1f2430;
    --text: #e7eaf0;
    --text-dim: #8b93a7;
    --text-faint: #545c6e;
    --signal: #3ddc84;
    --amber: #ff8a3d;
    --blue: #5b9dff;
    --red: #ff6b6b;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Scroll progress bar */
  #progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: var(--signal);
    z-index: 1000;
    width: 0%;
    transition: width .1s linear;
    box-shadow: 0 0 8px var(--signal);
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  /* Mouse glow */
  .glow-cursor {
    position: fixed;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(61,220,132,0.055) 0%, transparent 70%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 0;
    transition: left .12s ease, top .12s ease;
  }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  /* ---------- STICKY NAV ---------- */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(11,13,18,0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
  }
  .nav-mark {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-mark::before {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 8px var(--signal);
    animation: blink 1.8s ease-in-out infinite;
  }
  .nav-links { display: flex; align-items: center; gap: 28px; }
  .nav-links a {
    font-size: 13px;
    color: var(--text-dim);
    text-decoration: none;
    transition: color .15s;
  }
  .nav-links a:hover { color: var(--text); }
  .nav-cta {
    font-family: var(--mono);
    font-size: 13px;
    color: #06120c;
    background: var(--signal);
    padding: 9px 18px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 700;
    transition: transform .15s, box-shadow .15s;
  }
  .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(61,220,132,0.25); }
  @media (max-width: 640px) { .nav-links { display: none; } }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* ---------- SCROLL REVEAL ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity .55s ease, transform .55s ease;
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* ---------- HERO ---------- */
  .hero { padding: 88px 0 60px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: .14em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .eyebrow span { color: var(--signal); }

  h1 {
    font-family: var(--mono);
    font-weight: 800;
    font-size: clamp(32px, 5.5vw, 54px);
    line-height: 1.06;
    max-width: 820px;
  }
  h1 .accent { color: var(--signal); }

  .hero-sub {
    margin-top: 20px;
    font-size: 17px;
    color: var(--text-dim);
    max-width: 540px;
    line-height: 1.65;
  }

  .hero-actions {
    margin-top: 34px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn-primary {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 14px;
    background: var(--signal);
    color: #06120c;
    padding: 13px 24px;
    border-radius: 8px;
    text-decoration: none;
    transition: transform .15s, box-shadow .15s;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(61,220,132,0.25); }
  .btn-secondary {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 13px 24px;
    border-radius: 8px;
    text-decoration: none;
    transition: border-color .15s, color .15s;
  }
  .btn-secondary:hover { border-color: var(--text-dim); color: var(--text); }

  /* ---------- LIVE METRICS ---------- */
  .metrics {
    margin-top: 56px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  @media (max-width: 640px) { .metrics { grid-template-columns: repeat(2,1fr); } }
  .metric {
    background: var(--bg-raised);
    padding: 24px 20px;
    text-align: center;
  }
  .metric-num {
    font-family: var(--mono);
    font-size: 34px;
    font-weight: 800;
    color: var(--signal);
    line-height: 1;
  }
  .metric-label {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  /* ---------- LIVE TRACE ---------- */
  .trace {
    margin-top: 48px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .trace-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 11px 18px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
  }
  .trace-dot { width: 9px; height: 9px; border-radius: 50%; }
  .d1{background:#ff5f57} .d2{background:#febc2e} .d3{background:#28c840}
  .trace-title { margin-left: 6px; }
  .trace-body {
    padding: 18px 22px 22px;
    font-family: var(--mono);
    font-size: 13px;
    min-height: 210px;
  }
  .tline {
    display: flex;
    gap: 12px;
    padding: 4px 0;
    opacity: 0;
    transform: translateY(3px);
    animation: rise .3s ease forwards;
  }
  .tline .ts { color: var(--text-faint); width: 60px; flex-shrink: 0; }
  .tline .tag { width: 88px; flex-shrink: 0; font-weight: 700; }
  .tag.research{color:var(--blue)} .tag.outreach{color:var(--signal)} .tag.score{color:var(--amber)} .tag.crm{color:var(--text-dim)}
  .tline .msg { color: var(--text); }
  .dim { color: var(--text-dim); }
  @keyframes rise { to { opacity:1; transform:translateY(0); } }

  /* ---------- SECTION COMMON ---------- */
  .section { padding: 80px 0; border-top: 1px solid var(--line); }
  .section-eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--signal);
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .section-title {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(22px, 3.2vw, 30px);
    max-width: 580px;
    line-height: 1.25;
  }
  .section-title .dim { color: var(--text-dim); }

  /* ---------- REAL OUTPUT SHOWCASE ---------- */
  .showcase {
    margin-top: 44px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 760px) { .showcase { grid-template-columns: 1fr; } }

  .show-input {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg-raised);
    padding: 22px;
  }
  .show-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: .1em;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .show-label .tag-pill {
    background: rgba(91,157,255,0.12);
    color: var(--blue);
    border: 1px solid rgba(91,157,255,0.25);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
  }
  .show-field { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .show-field:last-child { border-bottom: none; }
  .show-field .k { color: var(--text-dim); }
  .show-field .v { font-family: var(--mono); color: var(--text); font-weight: 600; }

  .show-output-col { display: flex; flex-direction: column; gap: 14px; }

  .out-block {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg-raised);
    overflow: hidden;
  }
  .out-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 11px;
  }
  .out-header .label { color: var(--text-dim); }
  .out-header .badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 700;
  }
  .badge-research { background: rgba(91,157,255,0.12); color: var(--blue); border: 1px solid rgba(91,157,255,0.25); }
  .badge-msg { background: rgba(61,220,132,0.1); color: var(--signal); border: 1px solid rgba(61,220,132,0.25); }
  .badge-email { background: rgba(255,138,61,0.1); color: var(--amber); border: 1px solid rgba(255,138,61,0.25); }
  .badge-score { background: rgba(255,107,107,0.1); color: var(--red); border: 1px solid rgba(255,107,107,0.25); }

  .out-body {
    padding: 14px 16px;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text-dim);
  }
  .out-body strong { color: var(--text); font-weight: 600; }
  .out-body .sig-line { color: var(--signal); font-family: var(--mono); font-size: 12px; }

  .score-row { display: flex; align-items: center; gap: 12px; }
  .score-big { font-family: var(--mono); font-size: 36px; font-weight: 800; color: var(--signal); }
  .score-big span { font-size: 16px; color: var(--text-faint); }
  .hot-badge {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--amber);
    background: rgba(255,138,61,0.1);
    border: 1px solid rgba(255,138,61,0.3);
    padding: 5px 12px;
    border-radius: 6px;
  }
  .mini-bar { height: 5px; background: var(--line); border-radius: 4px; margin-top: 10px; overflow: hidden; }
  .mini-fill { height: 100%; width: 91%; background: linear-gradient(90deg, var(--amber), var(--signal)); border-radius: 4px; }

  /* ---------- ARCHITECTURE ---------- */
  .arch {
    margin-top: 44px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg-raised);
    padding: 36px 28px;
    text-align: center;
  }
  .arch-flow {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0;
    margin-top: 8px;
  }
  .arch-node {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
    text-align: center;
    background: var(--bg-card);
    min-width: 130px;
  }
  .arch-node .n-icon { font-size: 22px; margin-bottom: 8px; }
  .arch-node .n-name {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .arch-node .n-desc { font-size: 11.5px; color: var(--text-faint); }
  .arch-node:nth-child(1) .n-name { color: var(--blue); }
  .arch-node:nth-child(3) .n-name { color: var(--signal); }
  .arch-node:nth-child(5) .n-name { color: var(--amber); }
  .arch-node:nth-child(7) .n-name { color: var(--text-dim); }
  .arch-node:nth-child(9) .n-name { color: var(--red); }
  .arch-arrow {
    font-family: var(--mono);
    color: var(--text-faint);
    font-size: 16px;
    padding: 0 10px;
  }
  @media (max-width: 760px) {
    .arch-flow { flex-direction: column; }
    .arch-arrow { transform: rotate(90deg); }
  }

  .arch-user {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 10px 18px;
    margin-bottom: 20px;
    display: inline-block;
  }

  /* ---------- HOW IT WORKS ---------- */
  .flow {
    margin-top: 44px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  @media (max-width: 760px) { .flow { grid-template-columns: 1fr; } }
  .flow-step { background: var(--bg-raised); padding: 26px 20px; }
  .flow-num { font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
  .flow-name { font-family: var(--mono); font-weight: 700; font-size: 15px; margin: 10px 0 7px; }
  .flow-step:nth-child(1) .flow-name{color:var(--blue)}
  .flow-step:nth-child(2) .flow-name{color:var(--signal)}
  .flow-step:nth-child(3) .flow-name{color:var(--amber)}
  .flow-step:nth-child(4) .flow-name{color:var(--text-dim)}
  .flow-desc { font-size: 13px; color: var(--text-dim); line-height: 1.55; }

  /* ---------- FEATURES ---------- */
  .feat-grid {
    margin-top: 44px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  @media (max-width: 640px) { .feat-grid { grid-template-columns: 1fr; } }
  .feat {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 20px 22px;
    background: var(--bg-raised);
    transition: border-color .2s, transform .2s;
  }
  .feat:hover { border-color: rgba(61,220,132,0.25); transform: translateY(-2px); }
  .feat-icon { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-bottom: 10px; }
  .feat h3 { font-family: var(--mono); font-size: 15px; font-weight: 700; margin-bottom: 7px; }
  .feat p { font-size: 13.5px; color: var(--text-dim); line-height: 1.6; }

  /* ---------- STACK ---------- */
  .stack-row { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 10px; }
  .stack-pill {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 100px;
    transition: border-color .2s, color .2s;
  }
  .stack-pill:hover { border-color: var(--signal); color: var(--signal); }

  /* ---------- FAQ ---------- */
  .faq { margin-top: 44px; display: flex; flex-direction: column; gap: 2px; }
  .faq-item {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg-raised);
    overflow: hidden;
  }
  .faq-q {
    width: 100%;
    background: none;
    border: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    text-align: left;
    padding: 18px 20px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .faq-q .arrow { font-family: var(--mono); color: var(--text-faint); transition: transform .2s; }
  .faq-item.open .arrow { transform: rotate(45deg); }
  .faq-a {
    max-height: 0;
    overflow: hidden;
    transition: max-height .3s ease, padding .3s ease;
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.65;
    padding: 0 20px;
  }
  .faq-item.open .faq-a { max-height: 200px; padding: 0 20px 18px; }

  /* ---------- ABOUT ---------- */
  .about-card {
    margin-top: 44px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg-raised);
    padding: 32px 28px;
    display: flex;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
  }
  .about-avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--signal), var(--blue));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 800;
    color: #06120c;
    flex-shrink: 0;
  }
  .about-text h3 { font-family: var(--mono); font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .about-text p { font-size: 14px; color: var(--text-dim); line-height: 1.65; max-width: 500px; }
  .about-links { margin-top: 14px; display: flex; gap: 12px; flex-wrap: wrap; }
  .about-link {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 6px 14px;
    border-radius: 6px;
    text-decoration: none;
    transition: border-color .2s, color .2s;
  }
  .about-link:hover { border-color: var(--signal); color: var(--signal); }

  /* ---------- PILOT ---------- */
  .pilot-box {
    margin-top: 44px;
    border: 1px dashed rgba(61,220,132,0.3);
    border-radius: 12px;
    padding: 28px;
    background: rgba(61,220,132,0.03);
    text-align: center;
  }
  .pilot-box h3 { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--signal); margin-bottom: 10px; }
  .pilot-box p { font-size: 14px; color: var(--text-dim); max-width: 420px; margin: 0 auto; line-height: 1.65; }

  /* ---------- CTA ---------- */
  .cta-section {
    padding: 96px 0 100px;
    border-top: 1px solid var(--line);
    text-align: center;
  }
  .cta-section h2 {
    font-family: var(--mono);
    font-weight: 800;
    font-size: clamp(26px, 4.5vw, 40px);
    max-width: 620px;
    margin: 0 auto;
    line-height: 1.15;
  }
  .cta-section h2 .accent { color: var(--signal); }
  .cta-section p { color: var(--text-dim); margin-top: 14px; font-size: 15px; }
  .cta-section .btn-primary { margin-top: 30px; padding: 15px 32px; font-size: 15px; display: inline-block; }

  /* ---------- FOOTER ---------- */
  footer {
    border-top: 1px solid var(--line);
    padding: 28px 0 44px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    flex-wrap: wrap;
    gap: 12px;
  }
  footer a { color: var(--text-dim); text-decoration: none; }
  footer a:hover { color: var(--signal); }

  /* ---------- BACK TO TOP ---------- */
  #back-top {
    position: fixed;
    bottom: 28px; right: 24px;
    width: 40px; height: 40px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 16px;
    color: var(--text-dim);
    text-decoration: none;
    z-index: 200;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .25s, transform .25s, border-color .15s;
  }
  #back-top.show { opacity: 1; transform: translateY(0); }
  #back-top:hover { border-color: var(--signal); color: var(--signal); }
</style>
</head>
<body>

<div id="progress-bar"></div>
<div class="glow-cursor" id="glow"></div>
<a href="#" id="back-top" title="Back to top">↑</a>

<nav>
  <div class="wrap">
    <div class="nav-inner">
      <div class="nav-mark">ai-sdr-agent</div>
      <div class="nav-links">
        <a href="#output">Output</a>
        <a href="#how">How it works</a>
        <a href="#faq">FAQ</a>
        <a href="#about">About</a>
      </div>
      <a class="nav-cta" href="https://ai-sdr-agent-u8m5zulvxnjbjxugbwuhpp.streamlit.app/" target="_blank">Run it live →</a>
    </div>
  </div>
</nav>

<div class="wrap">

  <!-- HERO -->
  <section class="hero">
